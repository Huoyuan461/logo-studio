<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Studio · 一句话生成精致简约 Logo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#f4f5f7;color:#111827;line-height:1.6}
  header{max-width:1180px;margin:0 auto;padding:36px 20px 8px}
  header h1{font-size:30px;letter-spacing:.02em}
  header h1 span{color:#4f46e5}
  header p{color:#6b7280;margin-top:6px;font-size:15px}
  main{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:20px}
  .panel label{display:block;font-size:13px;color:#6b7280;margin:16px 0 6px;font-weight:600}
  .panel label:first-child{margin-top:0}
  .panel input[type=text],.panel textarea,.panel select{width:100%;padding:11px 12px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;font-family:inherit}
  .panel input:focus,.panel textarea:focus,.panel select:focus{border-color:#4f46e5}
  .panel textarea{resize:vertical;min-height:64px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:7px 13px;border-radius:999px;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;font-size:13px}
  .chip.on{background:#111827;color:#fff;border-color:#111827}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent;padding:0}
  .sw.on{border-color:#111827;transform:scale(1.08)}
  .btn{width:100%;margin-top:22px;padding:14px;border:none;border-radius:12px;background:#111827;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .btn:hover{background:#4f46e5}
  .btn2{width:100%;margin-top:10px;padding:11px;border:1.5px solid #e5e7eb;border-radius:12px;background:#fff;font-size:14px;cursor:pointer}
  .hint{font-size:12px;color:#9ca3af;margin-top:14px}
  .results{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  @media(max-width:640px){.results{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .preview{height:230px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .2s}
  .preview.light{background:#f8fafc}
  .preview.dark{background:#111827}
  .preview svg{max-width:88%;max-height:200px}
  .bg-toggle{position:absolute;top:12px;right:12px;font-size:12px;border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:4px 11px;cursor:pointer}
  .meta{padding:16px 18px 18px}
  .meta h3{font-size:15px}
  .meta p{font-size:13px;color:#6b7280;margin-top:2px;min-height:20px}
  .dl{display:flex;gap:8px;margin-top:12px}
  .dl button{flex:1;padding:9px;border-radius:9px;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;font-size:13px}
  .dl button:hover{border-color:#111827}
  .empty{grid-column:1/-1;background:#fff;border-radius:16px;padding:60px 20px;text-align:center;color:#9ca3af}
  footer{max-width:1180px;margin:0 auto;padding:8px 20px 40px;color:#9ca3af;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Logo <span>Studio</span></h1>
  <p>说出你的想法，一键生成 6 款精致简约的 Logo。纯本地运行，不联网、不收费，SVG 矢量可直接下载商用改稿。</p>
</header>
<main>
  <section class="panel">
    <label>品牌名称 *</label>
    <input type="text" id="name" value="讯环" placeholder="例如：讯环、青禾、云栖">
    <label>一句话说出你的想法 *</label>
    <textarea id="idea" placeholder="例如：给服务器定时任务站岗，任务没跑就立刻告警">给服务器定时任务站岗，任务没跑就立刻告警</textarea>
    <label>行业</label>
    <div class="chips" id="industryChips"></div>
    <label>风格</label>
    <div class="chips" id="styleChips"></div>
    <label>配色</label>
    <div class="swatches" id="swatches"></div>
    <button class="btn" onclick="generate()">生成 Logo</button>
    <button class="btn2" onclick="shuffle()">↻ 换一批配色 / 构图</button>
    <p class="hint">小提示：想法里带关键词效果更好，比如「监控、咖啡、山、云、安全、速度、自然、教育」。没命中关键词时会自动用品牌首字做字母徽章，同样好看。</p>
  </section>
  <section class="results" id="results"></section>
</main>
<footer>Logo Studio · 第一版：确定性 SVG 生成（零成本、秒出、可编辑）。第二阶段可接 AI 图像模型（Flux 等）生成插画感更强的图形，SVG 版作为可编辑底稿保留。</footer>

<script>
const INDUSTRIES = ["科技","餐饮","教育","医疗","金融","电商","制造","文旅"];
const STYLES = [{id:"minimal",label:"极简几何"},{id:"line",label:"细线条"},{id:"badge",label:"徽章"},{id:"mono",label:"字母徽章"}];
const PALETTES = [
  {name:"深海蓝", c:"#1d4ed8", dark:"#1e3a8a", ink:"#0f172a", soft:"#dbeafe"},
  {name:"墨绿", c:"#0f766e", dark:"#115e59", ink:"#134e4a", soft:"#ccfbf1"},
  {name:"暖陶橙", c:"#c2410c", dark:"#9a3412", ink:"#431407", soft:"#ffedd5"},
  {name:"葡萄紫", c:"#6d28d9", dark:"#5b21b6", ink:"#1e1b4b", soft:"#ede9fe"},
  {name:"石墨金", c:"#b45309", dark:"#92400e", ink:"#111827", soft:"#fef3c7"},
  {name:"珊瑚红", c:"#be123c", dark:"#9f1239", ink:"#1f2937", soft:"#ffe4e6"},
  {name:"藏青金", c:"#1e3a5f", dark:"#0f2440", ink:"#0f172a", soft:"#e0e7f0"},
  {name:"曜石灰", c:"#334155", dark:"#0f172a", ink:"#0f172a", soft:"#e2e8f0"},
];
const INDUSTRY_EN = {"科技":"TECHNOLOGY","餐饮":"DINING","教育":"EDUCATION","医疗":"HEALTHCARE","金融":"FINANCE","电商":"E-COMMERCE","制造":"MANUFACTURING","文旅":"CULTURE & TRAVEL"};
let __gid = 0;
let industry = "科技", styleId = "minimal", paletteIdx = 0, seed = 0, LETTER = "L";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

/* ---------- 图形母题：每个返回 200x200 画布内的 SVG 片段 ---------- */
function motif(key, P, mode, gid){
  const fill = gid ? `url(#${gid})` : P;
  const F = mode === "line" ? `fill="none" stroke="${P}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"` : `fill="${fill}"`;
  switch(key){
    case "letter": return `<rect x="34" y="34" width="132" height="132" rx="34" fill="${fill}"/><text x="100" y="132" font-size="92" font-weight="700" fill="#fff" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">${esc(LETTER)}</text><circle cx="152" cy="152" r="10" fill="#fff" opacity=".9"/>`;
    case "check": return `<circle cx="100" cy="100" r="62" fill="${P}" opacity=".14"/><circle cx="100" cy="100" r="62" ${mode==="line"?F:`fill="none" stroke="${P}" stroke-width="10"`}/><path d="M68 102 L92 126 L134 78" fill="none" stroke="${P}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;
    case "radar": return `<circle cx="100" cy="100" r="62" fill="${P}" opacity=".10"/><path d="M100 100 L158 66 A62 62 0 0 1 162 100 Z" fill="${P}" opacity=".35"/><circle cx="100" cy="100" r="62" fill="none" stroke="${P}" stroke-width="6" opacity=".4"/><path d="M100 38 A62 62 0 0 1 162 100" fill="none" stroke="${P}" stroke-width="8" stroke-linecap="round"/><path d="M100 68 A32 32 0 0 1 132 100" fill="none" stroke="${P}" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="100" r="12" fill="${P}"/>`;
    case "leaf": return `<path d="M100 36 C142 66 142 122 100 164 C58 122 58 66 100 36Z" ${F}/><path d="M100 36 C120 60 128 100 100 164" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/><path d="M100 60 L100 150" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/><path d="M100 150 L100 172" stroke="${P}" stroke-width="6" stroke-linecap="round"/>`;
    case "mountain": return `<path d="M28 152 L84 66 L112 112 L132 84 L172 152Z" fill="${P}" opacity=".35"/><path d="M36 152 L92 52 L122 102 L142 72 L166 152Z" ${F}/><path d="M80 74 L92 52 L104 74 L96 82 L88 76Z" fill="#fff" opacity=".95"/>`;
    case "cup": return `<path d="M62 78 H138 L132 152 Q131 164 118 164 H84 Q71 164 70 152Z" ${F}/><path d="M138 88 Q162 88 158 112 Q155 130 136 128" fill="none" stroke="${P}" stroke-width="8" stroke-linecap="round"/><path d="M88 56 Q84 46 90 40 M112 56 Q108 46 114 40" fill="none" stroke="${P}" stroke-width="6" stroke-linecap="round"/><line x1="56" y1="176" x2="148" y2="176" stroke="${P}" stroke-width="7" stroke-linecap="round" opacity=".6"/>`;
    case "bolt": return `<path d="M112 32 L58 110 H94 L84 168 L142 88 H106Z" ${F}/><path d="M104 52 L76 108 H96 L90 142" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`;
    case "shield": return `<path d="M100 32 L156 58 V104 C156 140 130 160 100 170 C70 160 44 140 44 104 V58Z" ${F}/><path d="M100 50 L138 68 V102 C138 126 120 140 100 148 C80 140 62 126 62 102 V68Z" fill="none" stroke="#fff" stroke-width="4" opacity=".65"/><path d="M74 102 L94 122 L128 82" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
    case "wave": return `<path d="M30 84 Q55 58 80 84 T130 84 T180 84" fill="none" stroke="${P}" stroke-width="10" stroke-linecap="round"/><path d="M30 122 Q55 96 80 122 T130 122 T180 122" fill="none" stroke="${P}" stroke-width="10" stroke-linecap="round" opacity=".55"/><path d="M52 152 Q76 134 100 152 T148 152" fill="none" stroke="${P}" stroke-width="8" stroke-linecap="round" opacity=".3"/>`;
    case "sun": return `<circle cx="100" cy="100" r="34" ${F}/>` + [0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180,x1=100+52*Math.cos(r),y1=100+52*Math.sin(r),x2=100+68*Math.cos(r),y2=100+68*Math.sin(r);return `<line x1="${x1.toFixed(0)}" y1="${y1.toFixed(0)}" x2="${x2.toFixed(0)}" y2="${y2.toFixed(0)}" stroke="${P}" stroke-width="8" stroke-linecap="round"/>`}).join("") + `<circle cx="100" cy="100" r="34" fill="#fff" opacity=".18"/>`;
    case "spark": return `<path d="M100 28 L116 84 L172 100 L116 116 L100 172 L84 116 L28 100 L84 84Z" ${F}/><circle cx="168" cy="52" r="9" fill="${P}"/><circle cx="40" cy="148" r="6" fill="${P}" opacity=".6"/>`;
    case "house": return `<path d="M100 36 L164 96 H142 V160 H58 V96Z" ${F}/><path d="M100 36 L164 96 H142 L100 58Z" fill="#fff" opacity=".22"/><rect x="88" y="118" width="24" height="42" fill="#fff" opacity=".92"/>`;
    case "bag": return `<path d="M58 74 H142 L136 162 Q135 170 126 170 H74 Q65 170 64 162Z" ${F}/><path d="M76 84 Q76 40 100 40 Q124 40 124 84" fill="none" stroke="${P}" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="96" r="9" fill="#fff" opacity=".9"/>`;
    case "book": return `<path d="M100 44 C84 32 56 32 40 40 V152 C56 144 84 144 100 156 C116 144 144 144 160 152 V40 C144 32 116 32 100 44Z" ${F}/><line x1="100" y1="44" x2="100" y2="156" stroke="#fff" stroke-width="5"/><path d="M128 60 L128 132" stroke="#fff" stroke-width="4" opacity=".5"/><path d="M140 148 L152 164 L158 148" fill="${P}"/>`;
    case "heart": return `<path d="M100 158 C50 122 32 92 32 70 C32 48 50 36 66 36 C80 36 92 44 100 58 C108 44 120 36 134 36 C150 36 168 48 168 70 C168 92 150 122 100 158Z" ${F}/><path d="M52 100 H80 L92 82 L108 118 L120 100 H148" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    case "chat": return `<path d="M40 52 Q40 36 56 36 H144 Q160 36 160 52 V116 Q160 132 144 132 H96 L64 158 V132 H56 Q40 132 40 116Z" ${F}/><circle cx="70" cy="84" r="8" fill="#fff"/><circle cx="100" cy="84" r="8" fill="#fff"/><circle cx="130" cy="84" r="8" fill="#fff"/>`;
    case "gear": return `<circle cx="100" cy="100" r="30" ${mode==="line"?F:`fill="${fill}"`}/><circle cx="100" cy="100" r="52" fill="none" stroke="${P}" stroke-width="16" stroke-dasharray="14 12"/><circle cx="100" cy="100" r="12" fill="#fff" opacity=".9"/>`;
    case "cloud": return `<path d="M66 144 Q44 144 44 122 Q44 100 64 96 Q70 66 100 66 Q130 66 136 94 Q160 92 160 118 Q160 144 134 144Z" ${F}/><circle cx="142" cy="60" r="12" fill="${P}" opacity=".7"/>`;
    default: return "";
  }
}

const KEYWORDS = [
  [/监控|站岗|告警|准时|打卡|任务|提醒|准点|ping/, "check", "圆环 + 对勾：任务准时完成、一次不落"],
  [/信号|雷达|网络|在线|服务|系统|服务器|运维/, "radar", "雷达弧线：7×24 小时在线守望"],
  [/咖啡|茶|餐饮|餐厅|面包|美食|厨房/, "cup", "咖啡杯 + 热气：温暖、日常、有烟火气"],
  [/山|户外|登山|旅行|稳固|攀登|高峰/, "mountain", "山峰：稳固、可信、不断向上"],
  [/自然|环保|绿色|植物|健康|有机|叶子/, "leaf", "叶片：自然、生长、有生命力"],
  [/云|同步|存储|数据|平台|saas/, "cloud", "云朵：轻盈、可靠、随时在线"],
  [/速度|闪电|能源|充电|快|极速|动力/, "bolt", "闪电：快、直接、有能量"],
  [/安全|金融|保险|盾|保护|支付|信任/, "shield", "盾牌 + 对勾：安全、可信"],
  [/水|物流|流动|航运|海洋|波浪/, "wave", "波浪：流动、顺畅、不断向前"],
  [/阳光|能源|希望|光伏|太阳/, "sun", "太阳：能量、积极、可靠"],
  [/创意|灵感|优质|星|闪耀|精品/, "spark", "四角星：灵感、品质、脱颖而出"],
  [/房产|家居|家|住宅|装修/, "house", "房子：安稳、归属感"],
  [/电商|购物|零售|商店|商城|包/, "bag", "购物袋：买卖、交易、生活方式"],
  [/教育|书|学习|课程|学校|培训/, "book", "书本：知识、成长、专业"],
  [/医疗|健康|爱|公益|关怀|心/, "heart", "心电图：关怀、生命力"],
  [/社交|聊天|服务|客服|沟通|社区/, "chat", "对话框：沟通、服务、亲近"],
  [/制造|工业|机械|工厂|齿轮|生产/, "gear", "齿轮：精密、工业、可靠"],
];
function detectMotif(idea){
  for(const [re, key, note] of KEYWORDS){
    if(re.test(idea)) return {key, note};
  }
  return null;
}

/* ---------- 构图 ---------- */
function fontSizeFor(name){
  const n = [...name].length;
  if(n <= 2) return 46; if(n <= 4) return 40; if(n <= 6) return 34; return 28;
}
function nameText(name, x, y, size, color, anchor="middle", ls="0.06em"){
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="700" fill="${color}" text-anchor="${anchor}" letter-spacing="${ls}" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">${esc(name)}</text>`;
}
function subText(en, x, y, anchor="middle"){
  return `<text x="${x}" y="${y}" font-size="12" letter-spacing="0.34em" fill="#9ca3af" text-anchor="${anchor}" font-family="system-ui,sans-serif">${esc(en)}</text>`;
}
function buildLogo(variant, name, motifKey, note, P){
  const fs = fontSizeFor(name);
  const ink = "#111827";
  const gid = "lg" + (__gid++);
  const defs = `<defs><linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${P.c}"/><stop offset="100%" stop-color="${P.dark || P.c}"/></linearGradient></defs>`;
  const en = INDUSTRY_EN[industry] || "";
  switch(variant){
    case 0: // 横排
      return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">${defs}<circle cx="108" cy="100" r="92" fill="${P.soft}"/><g transform="translate(8,0)">${motif(motifKey,P.color,"fill",gid)}</g>${nameText(name, 236, 106, fs, ink, "start")}${subText(en, 238, 142, "start")}</svg>`,
              note: note + " · 横排组合，适合网站导航与名片"};
    case 1: // 竖排
      return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">${defs}<circle cx="120" cy="104" r="96" fill="${P.soft}"/><g transform="translate(20,4)">${motif(motifKey,P.color,"fill",gid)}</g>${nameText(name, 120, 252, Math.min(fs,36), ink)}${subText(en, 120, 278)}</svg>`,
              note: note + " · 竖排组合，适合 App 图标与社交头像"};
    case 2: { // 徽章
      const inner = `<g transform="translate(58,42) scale(0.62)">${motif(motifKey,P.color,"fill",gid)}</g>`;
      return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">${defs}<circle cx="120" cy="104" r="92" fill="${P.soft}"/><circle cx="120" cy="104" r="92" fill="none" stroke="${P.color}" stroke-width="5"/><circle cx="120" cy="104" r="80" fill="none" stroke="${P.color}" stroke-width="1.5" opacity=".4"/>${inner}${nameText(name, 120, 240, Math.min(fs,32), ink)}${subText(en, 120, 264)}</svg>`,
              note: note + " · 双线徽章，适合印章、包装与认证感场景"};
    }
    case 3: { // 字母徽章
      const ch = [...name][0] || "L";
      return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">${defs}<rect x="30" y="14" width="180" height="180" rx="42" fill="url(#${gid})"/><text x="120" y="140" font-size="104" font-weight="700" fill="#fff" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">${esc(ch)}</text><circle cx="188" cy="188" r="14" fill="${P.color}"/>${nameText(name, 120, 240, Math.min(fs,32), ink)}${subText(en, 120, 264)}</svg>`,
              note: "品牌首字 + 渐变圆角方块：极简字母标，辨识度最高"};
    }
    case 4: // 细线条
      return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">${defs}<g transform="translate(8,0)">${motif(motifKey,P.color,"line",null)}</g>${nameText(name, 236, 106, fs, ink, "start")}${subText(en, 238, 142, "start")}</svg>`,
              note: note + " · 细线条版，适合高端、轻盈的品牌气质"};
    default: { // 抽象几何
      const abs = `<circle cx="100" cy="100" r="62" fill="url(#${gid})"/><rect x="118" y="52" width="54" height="14" rx="7" fill="${P.color}" opacity=".55"/><circle cx="152" cy="150" r="16" fill="${P.color}" opacity=".8"/><circle cx="100" cy="100" r="62" fill="#fff" opacity=".08"/>`;
      return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">${defs}<circle cx="108" cy="100" r="92" fill="${P.soft}"/><g transform="translate(8,0)">${abs}</g>${nameText(name, 236, 106, fs, ink, "start")}${subText(en, 238, 142, "start")}</svg>`,
              note: "抽象几何：渐变圆 + 横线 + 圆点，现代感最强，不依赖具象图形"};
    }
  }
}

function downloadSVG(svgStr, filename){
  const blob = new Blob([svgStr], {type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function downloadPNG(svgStr, filename){
  const img = new Image();
  const svg64 = btoa(unescape(encodeURIComponent(svgStr)));
  img.onload = ()=>{
    const scale = 4, w = img.width || 560, h = img.height || 200;
    const canvas = document.createElement("canvas");
    canvas.width = w * scale; canvas.height = h * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png"); a.download = filename; a.click();
  };
  img.src = "data:image/svg+xml;base64," + svg64;
}

function renderChips(){
  document.getElementById("industryChips").innerHTML = INDUSTRIES.map(i=>
    `<button class="chip ${i===industry?"on":""}" onclick="industry='${i}';renderChips()">${i}</button>`).join("");
  document.getElementById("styleChips").innerHTML = STYLES.map(s=>
    `<button class="chip ${s.id===styleId?"on":""}" onclick="styleId='${s.id}';renderChips()">${s.label}</button>`).join("");
  document.getElementById("swatches").innerHTML = PALETTES.map((p,i)=>
    `<button class="sw ${i===paletteIdx?"on":""}" style="background:${p.c}" title="${p.name}" onclick="paletteIdx=${i};renderChips()"></button>`).join("");
}

function generate(){
  const name = document.getElementById("name").value.trim();
  const idea = document.getElementById("idea").value.trim();
  const box = document.getElementById("results");
  if(!name){ box.innerHTML = `<div class="empty">请先填写品牌名称。</div>`; return; }
  const found = detectMotif(idea + " " + industry);
  const motifKey = found ? found.key : null;
  LETTER = [...name][0] || "L";
  const baseNote = found ? found.note : "品牌首字徽章：无具象关键词时最稳妥的方案";
  const P = PALETTES[(paletteIdx + seed) % PALETTES.length];
  const P2 = PALETTES[(paletteIdx + seed + 2) % PALETTES.length];
  const order = styleId === "line" ? [4,0,1,2,3,5] : styleId === "badge" ? [2,0,1,3,4,5] : styleId === "mono" ? [3,0,1,2,4,5] : [0,1,2,3,4,5];
  const variants = order.map((v, i)=>{
    const pal = i % 2 === 0 ? P : P2;
    const key = motifKey || "letter";
    if(v === 3){
      const r = buildLogo(3, name, key, baseNote, pal);
      return {...r, pal};
    }
    if(v === 5){
      const r = buildLogo(5, name, key, baseNote, pal);
      return {...r, pal};
    }
    const r = buildLogo(v, name, key, baseNote, pal);
    return {...r, pal};
  });
  box.innerHTML = variants.map((v, i)=>{
    return `<div class="card">
      <div class="preview light" id="pv-${i}">${v.svg}
        <button class="bg-toggle" onclick="toggleBg(${i})">深色预览</button>
      </div>
      <div class="meta">
        <h3>方案 ${i+1} · ${v.pal.name}</h3>
        <p>${esc(v.note)}</p>
        <div class="dl">
          <button onclick='downloadSVG(document.getElementById("pv-${i}").querySelector("svg").outerHTML, "logo-${i+1}.svg")'>下载 SVG</button>
          <button onclick='downloadPNG(document.getElementById("pv-${i}").querySelector("svg").outerHTML, "logo-${i+1}.png")'>下载 PNG</button>
        </div>
      </div>
    </div>`;
  }).join("");
  // 注意：innerHTML 插入的 svg 带 xmlns，可直接 outerHTML 导出
}
function toggleBg(i){
  const el = document.getElementById("pv-" + i);
  const btn = el.querySelector(".bg-toggle");
  const dark = el.classList.toggle("dark");
  el.classList.toggle("light", !dark);
  btn.textContent = dark ? "浅色预览" : "深色预览";
}
function shuffle(){ seed = (seed + 1) % PALETTES.length; generate(); }

renderChips();
generate();
</script>
</body>
